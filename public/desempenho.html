<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desempenho · Gabarito</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="desempenho">
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Desempenho</h1>
        <p class="muted">Calculado a partir das suas respostas registradas (só questões com gabarito).</p>
      </div>
    </div>

    <div id="stats"><p class="muted">Carregando...</p></div>

    <div class="stack" style="margin-top: 18px;">
      <div class="grid-2" style="margin-top: 0;">
        <section class="card">
          <h2>Por disciplina</h2>
          <div id="disciplines"></div>
        </section>
        <section class="card">
          <h2>Evolução (últimos 30 dias)</h2>
          <div id="evolution"></div>
        </section>
      </div>

      <section class="card">
        <h2>Histórico de respostas</h2>
        <div id="history"></div>
      </section>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/desempenho.js"></script>
</body>
</html>
