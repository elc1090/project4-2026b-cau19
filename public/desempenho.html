<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desempenho · Gabarito</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="desempenho">
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Desempenho</h1>
        <p class="muted">Calculado a partir das suas respostas registradas (só questões com gabarito).</p>
      </div>
    </div>

    <div id="stats"><p class="muted">Carregando...</p></div>

    <div class="stack" style="margin-top: 18px;">
      <!-- Análise com IA -->
      <section class="card">
        <div class="card-header">
          <div>
            <h2>Análise com IA</h2>
            <p class="muted small" style="margin: 4px 0 0;">A IA lê só os seus números reais e aponta pontos fortes, dificuldades e o que estudar.</p>
          </div>
          <button type="button" class="btn btn-primary" id="analysis-button">Gerar análise</button>
        </div>
        <p id="analysis-error" class="notice notice-error" role="alert" hidden></p>
        <div id="analysis"><p class="muted">Carregando...</p></div>
      </section>

      <div class="grid-2" style="margin-top: 0;">
        <section class="card">
          <h2>Por disciplina</h2>
          <div id="disciplines"></div>
        </section>
        <section class="card">
          <h2>Evolução (últimos 30 dias)</h2>
          <div id="evolution"></div>
        </section>
      </div>

      <section class="card">
        <h2>Histórico de respostas</h2>
        <div id="history"></div>
      </section>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/desempenho.js"></script>
</body>
</html>
