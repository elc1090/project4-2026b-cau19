<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de questões · Gabarito</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="questoes">
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <!-- ========== LISTA (com filtros) ========== -->
    <section id="list-view">
      <div class="page-header">
        <div>
          <h1>Banco de questões</h1>
          <p class="muted">Filtre, pesquise e resolva.</p>
        </div>
        <a class="btn btn-primary" href="/adicionar.html">+ Adicionar questão</a>
      </div>

      <div class="tabs" role="tablist" aria-label="Quais questões mostrar">
        <button type="button" class="active" data-scope="all">Todas</button>
        <button type="button" data-scope="mine">Minhas</button>
        <button type="button" data-scope="shared">Compartilhadas <span class="badge badge-pro">PRO</span></button>
      </div>

      <form id="filters" class="card filters">
        <input class="filter-search" type="search" name="search" placeholder="Pesquisar por palavra-chave" aria-label="Pesquisar no enunciado, assunto ou origem" />
        <select name="area" aria-label="Área"></select>
        <select name="discipline" aria-label="Disciplina"></select>
        <select name="subject" aria-label="Assunto"></select>
        <button type="submit" class="btn btn-primary">Buscar</button>
        <button type="button" class="btn btn-ghost" id="clear-filters">Limpar</button>
      </form>

      <p id="list-info" class="muted small list-info"></p>
      <div id="question-list" class="question-list"></div>
    </section>

    <!-- ========== RESOLUÇÃO ========== -->
    <section id="solve-view" hidden>
      <div class="solve-toolbar">
        <button type="button" class="btn btn-ghost" id="back-button">← Voltar à lista</button>
        <span id="solve-position" class="muted small"></span>
        <button type="button" class="btn btn-ghost" id="next-button">Próxima →</button>
      </div>

      <article id="question-card" class="card question"></article>

      <!-- Dúvidas com IA (aparece ao clicar em "Perguntar à IA") -->
      <section id="doubt-panel" class="card doubt-panel" hidden>
        <h2>Perguntar à IA</h2>
        <p class="muted small">A IA recebe o enunciado, as alternativas e a sua dúvida. Ela pode errar: confira sempre na lei ou no material de estudo.</p>
        <div id="chat" class="chat" aria-live="polite"></div>
        <form id="doubt-form" class="doubt-form">
          <textarea name="message" rows="2" maxlength="1000" required placeholder="Ex.: Por que a alternativa B está correta?" aria-label="Sua dúvida"></textarea>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </section>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/questoes.js"></script>
</body>
</html>
